name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check htf/ tests/ --output-format=github

      - name: Type check (mypy)
        run: mypy htf/ --ignore-missing-imports --no-strict-optional

      - name: Test (pytest)
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest_out.txt

      - name: Validate test count badge
        if: matrix.python-version == '3.11'
        run: |
          COUNT=$(grep -oP '^\d+(?= passed)' pytest_out.txt | tail -1)
          BADGE=$(grep -oP '(?<=tests-)\d+(?=%20passing)' README.md)
          if [ -z "$COUNT" ]; then
            echo "::error::Could not parse pytest passed count from pytest_out.txt"
            exit 1
          fi
          if [ "$COUNT" != "$BADGE" ]; then
            echo "::error::Badge mismatch: pytest=$COUNT README=$BADGE — update README.md badge"
            exit 1
          fi
          echo "Badge OK: $COUNT tests passing"
