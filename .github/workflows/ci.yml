name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check htf/ tests/ --output-format=github

      - name: Type check (mypy)
        run: mypy htf/ --ignore-missing-imports --no-strict-optional

      - name: Test (pytest)
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest_out.txt

      - name: Validate test count badge
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        run: |
          COUNT=$(grep -oP '^\d+(?= passed)' pytest_out.txt | tail -1)
          BADGE=$(grep -oP '(?<=tests-)\d+(?=%20passing)' README.md)
          if [ -z "$COUNT" ]; then
            echo "::error::Could not parse pytest passed count from pytest_out.txt"
            exit 1
          fi
          if [ "$COUNT" != "$BADGE" ]; then
            echo "::error::Badge mismatch: pytest=$COUNT README=$BADGE — update README.md badge"
            exit 1
          fi
          echo "Badge OK: $COUNT tests passing"

  # C0-lock: install from uv.lock (pinned versions) and run tests
  test-locked:
    name: Test (locked deps, Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install from lockfile
        run: uv sync --frozen --extra dev

      - name: Test (pytest)
        run: uv run python -m pytest -q --tb=short

  # C0-min: test with the minimum declared dependency versions
  test-minimum-versions:
    name: Test (minimum versions, Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install minimum declared versions
        run: |
          pip install --upgrade pip
          pip install \
            "numpy==1.23" \
            "scipy==1.9" \
            "pytest==7.0" \
            "python-flint>=0.5" \
            "ruff" \
            "mypy" \
            -e "."

      - name: Test (pytest)
        run: python -m pytest -q --tb=short -x

  # Adapter version matrix: real quimb + TeNPy installs
  test-adapters:
    name: Test adapters (quimb=${{ matrix.quimb }}, tenpy=${{ matrix.tenpy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - quimb: "1.9.0"
            tenpy: "1.0.4"
          - quimb: "1.15.0"
            tenpy: "1.1.0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HTF + adapter dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "quimb==${{ matrix.quimb }}" "physics-tenpy==${{ matrix.tenpy }}"

      - name: Run adapter tests
        run: python -m pytest tests/test_quimb_adapter.py tests/test_tenpy_adapter.py -v --tb=short
