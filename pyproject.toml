[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "htf"
version = "0.23.0"
description = "A certified, type-safe string-diagram / tensor-network framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lin Tao" }]
keywords = [
    "tensor networks",
    "string diagrams",
    "applied category theory",
    "certified numerics",
    "MERA",
    "reproducibility",
]
dependencies = ["numpy>=1.23", "scipy>=1.9"]  # scipy used at import time in mps/mpo/tebd/open_systems/os_axioms

[project.optional-dependencies]
accel = ["jax", "opt_einsum"]          # optional GPU / contraction-path acceleration
certified = ["python-flint>=0.5"]      # certified mode: Arb interval arithmetic
mcp = ["mcp>=2,<3"]                    # MCP server wrapper (mcp 2.x API)
adapters = ["quimb>=0.6"]              # optional backend adapters (quimb MPS)
dev = ["pytest>=7", "python-flint>=0.5", "ruff", "mypy", "hypothesis>=6"]  # scipy now in core

[project.scripts]
htf = "htf.cli:main"
htf-mcp = "htf.mcp_server:main"
htf-verify = "htf.verify:main"

[tool.setuptools]
packages = ["htf", "htf.adapters", "htf.schemas"]

[tool.setuptools.package-data]
"htf.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C4", "BLE", "RUF"]
ignore = [
    "E501",    # line too long — physics equations legitimately exceed 88/120
    "E741",    # ambiguous variable name — I, l are standard linear-algebra notation
    "E702",    # multiple statements — deliberate one-liners in tests
    "RUF001",  # ambiguous string chars — intentional Unicode math (−, ×, ℝ, …)
    "RUF002",  # ambiguous docstring chars — same as above
    "RUF003",  # ambiguous comment chars — same as above
    "RUF005",  # list-concat — deliberate
    "RUF022",  # __all__ not sorted — grouped by module, not alphabetically
    "RUF043",  # regex metacharacters in match= — intentional
    "BLE001",  # blind exception — noqa on intentional catches; CI catches new ones
]

[tool.ruff.lint.per-file-ignores]
"htf/labs/__init__.py" = ["F401"]  # re-export module; all imports are intentional public API

[tool.mypy]
ignore_missing_imports = true
no_strict_optional = true
